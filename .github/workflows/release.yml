name: Release

# Builds a Release (universal arm64 + x86_64) MacIR.app with the latest Xcode,
# smoke-tests it, and publishes a zip and a disk image to GitHub Releases.
# Trigger by pushing a tag like v1.2.3, or run manually with a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'$RAW' is not a version like 1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APP=$PWD/build/Build/Products/Release/MacIR.app" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: IRCore tests
        run: swift test --package-path IRCore

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project MacIR.xcodeproj \
            -scheme MacIR \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Verify app bundle
        run: |
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/MacIR")
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::Expected a universal binary"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Format|flags|Signature"
          codesign --display --entitlements - "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleVersion|LSMinimumSystemVersion|CFBundleIdentifier"
          [[ "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" == "$VERSION" ]]

      - name: Launch smoke test
        run: |
          open -n "$APP"
          sleep 12
          pgrep -x MacIR > /dev/null || { echo "::error::MacIR did not stay running"; exit 1; }
          screencapture -x launch.png || true
          pkill -x MacIR

      - name: Package
        run: |
          mkdir -p dist dmg-staging
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/MacIR-$VERSION.zip"
          ditto "$APP" dmg-staging/MacIR.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "MacIR $VERSION" -srcfolder dmg-staging -ov -format UDZO "dist/MacIR-$VERSION.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -lh dist

      - name: Release notes
        run: |
          : > notes.md
          if [ -f ".github/changelog/$VERSION.md" ]; then
            cat ".github/changelog/$VERSION.md" >> notes.md
          fi
          sed "s/__VERSION__/$VERSION/g" .github/release-notes.md >> notes.md
          {
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Built with $(xcodebuild -version | head -1) on macOS $(sw_vers -productVersion) from ${GITHUB_SHA::7}."
          } >> notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "MacIR $VERSION"
          else
            gh release create "$TAG" dist/* --title "MacIR $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: |
            dist
            xcodebuild.log
            launch.png
