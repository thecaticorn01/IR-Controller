name: Android

# Reusable workflow that builds the Android app from the `android` branch.
#
# CI mode (no `version`): unit, protocol and screenshot tests, lint, and debug +
# release APKs.
# Both modes then install the release APK on emulators (the minimum and the
# target Android version), launch it and fail if it crashes.
# Release mode (`version` set): tests and lint, then a release APK stamped with
# the version, uploaded as `release-android`. When the caller passes the
# ANDROID_KEYSTORE_* secrets the APK is signed with that key; otherwise with a
# throwaway debug key (fine for sideloading, but updates then need a reinstall).
on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit of the Android app to build.
        type: string
        default: android
      version:
        description: Semantic version for a release build (e.g. 1.2.3); empty for CI.
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      commit:
        description: Commit that was built.
        value: ${{ jobs.build.outputs.commit }}
      signing:
        description: "`release-key` or `debug-key`."
        value: ${{ jobs.build.outputs.signing }}

jobs:
  build:
    name: ${{ inputs.version == '' && 'Build, test and lint' || 'Release build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      signing: ${{ steps.signing.outputs.signing }}
    env:
      VERSION: ${{ inputs.version }}
      BUILD_TOOLS: "37.0.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Source
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $(git rev-parse --short HEAD) from ${{ inputs.ref }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android 17 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;$BUILD_TOOLS"
      - name: Unit, protocol and UI screenshot tests
        run: ./gradlew test --console=plain
      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Build APKs
        if: inputs.version == ''
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Version code
        if: inputs.version != ''
        run: |
          # versionCode = MMmmpp·100 + (pre-release number, or 99 for a final release),
          # so 1.2.3 → 1020399 and 1.3.0-beta.2 → 1030002 (lower than 1.3.0 → 1030099).
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::'$VERSION' is not a Semantic Version"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]} MINOR=${BASH_REMATCH[2]} PATCH=${BASH_REMATCH[3]} PRE=${BASH_REMATCH[5]}
          if (( MINOR > 99 || PATCH > 99 || MAJOR > 2099 )); then
            echo "::error::Android versionCode supports minor/patch ≤ 99 and major ≤ 2099"; exit 1
          fi
          SUFFIX=99
          if [[ -n "$PRE" ]]; then
            NUMBER=$(grep -oE '[0-9]+' <<< "$PRE" | tail -1 || true)
            NUMBER=$(( 10#${NUMBER:-0} ))
            SUFFIX=$(( NUMBER > 98 ? 98 : NUMBER ))
          fi
          CODE=$(( ((MAJOR * 100 + MINOR) * 100 + PATCH) * 100 + SUFFIX ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName $VERSION, versionCode $CODE"

      - name: Signing key
        id: signing
        if: inputs.version != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signing=release-key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets; the release APK is signed with a debug key."
            echo "signing=debug-key" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: inputs.version != ''
        run: ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --console=plain

      - name: Verify and package
        if: inputs.version != ''
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=app/build/outputs/apk/release/app-release.apk
          BADGING=$("$TOOLS/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING"
          grep -q "versionName='$VERSION'" <<< "$BADGING" || { echo "::error::versionName mismatch"; exit 1; }
          grep -q "versionCode='$VERSION_CODE'" <<< "$BADGING" || { echo "::error::versionCode mismatch"; exit 1; }
          "$TOOLS/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/IR-Controller-$VERSION-android.apk"
          ls -lh dist

      - name: Upload release files
        if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist
          if-no-files-found: error
      - name: Upload APKs
        if: inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/**/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots${{ inputs.version != '' && '-release' || '' }}
          path: app/screenshots
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports${{ inputs.version != '' && '-release' || '' }}
          path: |
            app/build/reports
            core/build/reports

  launch-test:
    name: Launch test (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 26 = Android 8.0 (minSdk), 37.0 = Android 17 (targetSdk).
        api: ["26", "37.0"]
    env:
      PACKAGE: com.thecaticorn01.ircontroller
      IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version == '' && 'android-apks' || 'release-android' }}
          path: apk
      - name: Pick the release APK
        run: |
          APK=$(find apk -name '*.apk' | grep -E 'release|android\.apk' | head -1)
          [[ -n "$APK" ]] || { echo "::error::No release APK found"; find apk; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Testing $APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        timeout-minutes: 15
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "emulator" "platform-tools" "$IMAGE" > /dev/null
          "$EMULATOR" -accel-check || { echo "::error::Hardware acceleration (KVM) is unavailable"; exit 1; }
          # Put the AVD where both avdmanager and the emulator will look for it.
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force -n launch-test -k "$IMAGE" -p "$ANDROID_AVD_HOME/launch-test.avd"
          "$EMULATOR" -list-avds

          nohup "$EMULATOR" -avd launch-test -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel on -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> "$GITHUB_ENV"

          fail() {
            echo "::error::$1"
            echo "----- emulator.log -----"
            tail -80 emulator.log
            exit 1
          }
          # Wait for adb to see the device, then for Android to finish booting,
          # bailing out as soon as the emulator process dies.
          for i in $(seq 1 120); do
            kill -0 "$EMULATOR_PID" 2>/dev/null || fail "The emulator exited during startup"
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 5
          done
          [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] || fail "Android did not finish booting within 10 minutes"
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          echo "Booted Android $("$ADB" shell getprop ro.build.version.release | tr -d '\r') (API $("$ADB" shell getprop ro.build.version.sdk | tr -d '\r'))"
      - name: Install and launch
        timeout-minutes: 10
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p launch
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n "$PACKAGE/.MainActivity" | tee launch/am-start.txt
          sleep 20
          "$ADB" exec-out screencap -p > launch/screen.png || true
          "$ADB" logcat -d > launch/logcat.txt
          "$ADB" logcat -d -b crash > launch/crash.txt || true
          if [[ -s launch/crash.txt ]] || grep -q "FATAL EXCEPTION" launch/logcat.txt || ! "$ADB" shell pidof "$PACKAGE" > /dev/null; then
            echo "::error::IR Controller crashed or exited after launch on API ${{ matrix.api }}"
            echo "----- crash buffer -----"
            cat launch/crash.txt
            echo "----- AndroidRuntime -----"
            grep -A 60 "FATAL EXCEPTION" launch/logcat.txt | head -120
            exit 1
          fi
          echo "IR Controller is running (pid $("$ADB" shell pidof "$PACKAGE" | tr -d '\r'))."
      - name: Upload launch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-api-${{ matrix.api }}${{ inputs.version != '' && '-release' || '' }}
          path: |
            launch
            emulator.log
