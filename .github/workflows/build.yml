name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: IRCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path IRCore

  macos:
    name: macOS app (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-26: Xcode 26 / macOS 26 SDK. xcode-27: Xcode 27 / macOS 27 "Golden Gate" SDK.
        runner: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
      - name: IRCore tests
        run: swift test --package-path IRCore
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project MacIR.xcodeproj \
            -scheme MacIR \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
      - name: Launch smoke test and screenshots
        run: |
          APP="$PWD/build/Build/Products/Debug/MacIR.app"
          mkdir -p screenshots
          for route in welcome remote browse preview learn; do
            open -n "$APP" --stdout "$PWD/screenshots/$route.log" --stderr "$PWD/screenshots/$route.log" \
              --args -UITestRoute "$route" -UITestDemoData YES
            sleep 12
            if ! pgrep -x MacIR > /dev/null; then
              echo "::error::MacIR exited during launch ($route)"
              cat "screenshots/$route.log"
              exit 1
            fi
            screencapture -x "screenshots/$route.png" || echo "screencapture unavailable"
            pkill -x MacIR
            sleep 2
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.runner }}
          path: screenshots
      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacIR-app-${{ matrix.runner }}
          path: build/Build/Products/Debug/MacIR.app
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.runner }}
          path: xcodebuild.log
